<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WECADI Act 2 - Carte du Bar</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/favicon.png') }}">
  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    /* Configurazione Tailwind per i colori esatti */
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          },
          colors: {
            gold: '#D4AF37',
            goldDark: '#997A00',
            goldLight: '#F3E5AB',
            bgDark: '#0a0a0a',
            magentaCustom: '#E91E63'
          }
        }
      }
    }
  </script>

  <style>
    .text-gold-gradient {
      background: linear-gradient(to bottom, #FFF5CC 0%, #D4AF37 40%, #8A6623 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 4px 10px rgba(212, 175, 55, 0.3));
    }

    .box-gold-border {
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    /* Nascondere la scrollbar per un look più pulito, ma permettere lo scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body
  class="relative min-h-screen w-full flex flex-col items-center bg-bgDark text-white overflow-x-hidden font-sans pb-32">

  <!-- Sfondo con immagine oscurata -->
  <div class="fixed inset-0 z-0 pointer-events-none">
    <img src="https://images.unsplash.com/photo-1513106580091-1d82408b8cd6?q=80&w=2075&auto=format&fit=crop"
      alt="Rideaux Rouges" class="w-full h-full object-cover opacity-20">
    <div class="absolute inset-0 bg-gradient-to-b from-black/80 via-black/95 to-black"></div>
  </div>

  <!-- Header di navigazione -->
  <header class="relative z-30 w-full p-4 sm:p-6 flex justify-between items-center max-w-[900px]">
    <a href="/dashboard"
      class="flex items-center gap-2 px-4 py-2 rounded-full border border-gray-600 text-[10px] sm:text-xs font-bold text-gray-400 tracking-[0.1em] uppercase hover:bg-white/5 hover:text-white transition duration-300">
      <i class="fa-solid fa-arrow-left"></i> Dashboard
    </a>
    <div class="text-[10px] text-gold/50 uppercase tracking-[0.2em] font-bold">Menu Bar</div>
  </header>

  <main class="relative z-10 w-[95%] max-w-[600px] mt-4 flex flex-col">

    <!-- Titolo della pagina -->
    <div class="text-center mb-8">
      <h1 class="text-4xl sm:text-5xl font-serif font-black text-gold-gradient tracking-wider mb-2">PRÉ-COMMANDES</h1>
      <p class="text-[10px] sm:text-xs text-gray-400 uppercase tracking-widest leading-relaxed">
        Réservez vos bouteilles à l'avance.<br> Paiement à votre convenance (en ligne ou sur place).
      </p>
    </div>

    <!-- Avviso per Ruinart -->
    <div
      class="bg-gold/10 border border-gold/30 rounded-xl p-4 mb-8 flex items-center justify-between shadow-[0_0_15px_rgba(212,175,55,0.15)]">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-gem text-2xl text-gold"></i>
        <div>
          <h4 class="text-white font-bold text-sm tracking-widest uppercase">Champagne Ruinart</h4>
          <p class="text-[9px] text-goldLight uppercase tracking-widest mt-0.5">Exclusivement sur réservation</p>
        </div>
      </div>
      <a href="https://wa.me/393896123577?text=Bonjour%20Sergio%2C%20je%20souhaite%20r%C3%A9server%20du%20Ruinart%20pour%20l%27%C3%A9v%C3%A9nement%20WECADI."
        target="_blank"
        class="px-4 py-2 bg-black/50 border border-gold text-gold text-[9px] font-bold uppercase tracking-widest rounded hover:bg-gold hover:text-black transition duration-300 whitespace-nowrap">
        Contacter Sergio
      </a>
    </div>

    <!-- Contenitore principale del carrello -->
    <form id="barForm" action="/valider_panier" method="POST"
      class="bg-black/60 backdrop-blur-md box-gold-border rounded-2xl p-4 sm:p-6 mb-8">

      <input type="hidden" name="cart_data" id="cart_data" value="{}">

      <!-- Categoria: Champagnes & Vins -->
      <div class="mb-8">
        <h3
          class="text-gold font-bold uppercase tracking-widest text-xs border-b border-gold/30 pb-2 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-wine-glass-empty"></i> Champagnes & Vins
        </h3>
        <div class="space-y-4" id="category-vins">
          <!-- Gli elementi verranno generati dinamicamente via JS -->
        </div>
      </div>

      <!-- Categoria: Spiritueux -->
      <div class="mb-8">
        <h3
          class="text-gold font-bold uppercase tracking-widest text-xs border-b border-gold/30 pb-2 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-whiskey-glass"></i> Spiritueux
        </h3>
        <div class="space-y-4" id="category-spirits">
        </div>
      </div>

      <!-- Categoria: Softs -->
      <div class="mb-4">
        <h3
          class="text-gold font-bold uppercase tracking-widest text-xs border-b border-gold/30 pb-2 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-bottle-water"></i> Softs & Energisants
        </h3>
        <div class="space-y-4" id="category-softs">
        </div>
      </div>

    </form>
  </main>

  <!-- Barra fissa in basso (Sticky Bottom Bar per il totale) -->
  <div
    class="fixed bottom-0 left-0 w-full bg-bgDark border-t border-gold/30 p-4 sm:p-6 z-40 shadow-[0_-10px_30px_rgba(0,0,0,0.8)]">
    <div class="max-w-[600px] mx-auto flex items-center justify-between">
      <div class="flex flex-col">
        <span class="text-[10px] text-gray-400 uppercase tracking-widest">Total Estimé</span>
        <span class="text-2xl sm:text-3xl font-black text-gold"><span id="total-price">0</span>€</span>
      </div>
      <button type="button" onclick="submitCart()" id="btn-submit" disabled
        class="px-6 py-3.5 bg-gradient-to-r from-gray-700 to-gray-600 text-gray-400 font-black uppercase tracking-widest text-[10px] sm:text-xs rounded-lg transition-all duration-300 opacity-50 cursor-not-allowed">
        Valider la commande
      </button>
    </div>
  </div>

  <script>
    /* Definizione dei prodotti (Database lato client) */
    const inventory = {
      vins: [
        { id: 'moet', name: 'Moët', price: 100 },
        { id: 'veuve', name: 'Veuve Clicquot', price: 100 },
        { id: 'belaire', name: 'Luc Belaire', price: 80 },
        { id: 'colligny', name: 'Colligny', price: 75 },
        { id: 'prosecco', name: 'Prosecco', price: 30 },
        { id: 'spumante', name: 'Spumante', price: 30 }
      ],
      spirits: [
        { id: 'gold', name: 'Gold', price: 100 },
        { id: 'black_label', name: 'Black Label', price: 75 },
        { id: 'jack_daniel', name: 'Jack Daniel\'s', price: 70 },
        { id: 'vecchia_romagna', name: 'Vecchia Romagna', price: 40 },
        { id: 'baileys', name: 'Baileys', price: 40 }
      ],
      softs: [
        /* Aggiunta delle regole per le promozioni (bundle) */
        { id: 'redbull', name: 'Redbull', price: 4, bundleQty: 3, bundlePrice: 10, desc: '3 pour 10€ (ou 4€/u)' },
        { id: 'coca', name: 'Coca', price: 5, bundleQty: 3, bundlePrice: 10, desc: '3 pour 10€' },
        { id: 'malta', name: 'Malta', price: 5 },
        { id: 'eau', name: 'Eau', price: 2, bundleQty: 3, bundlePrice: 5, desc: '3 pour 5€' }
      ]
    };

    /* Inizializza il carrello recuperando i dati dal database tramite Jinja */
    let cart = {{ existing_cart | tojson | safe }};

    /* Funzione per generare l'HTML dei prodotti */
    function renderItems(categoryArray, containerId) {
      const container = document.getElementById(containerId);
      let html = '';

      categoryArray.forEach(item => {
        /* Se il prodotto esiste già nel database, usa quella quantità, altrimenti 0 */
        let initialQty = cart[item.id] || 0;
        cart[item.id] = initialQty;

        let descHtml = item.desc ? `<span class="block text-[9px] text-gray-500 font-normal tracking-widest">${item.desc}</span>` : '';

        html += `
            <div class="flex items-center justify-between bg-black/40 p-3 rounded-lg border border-white/5">
                <div class="flex flex-col">
                    <span class="text-white font-bold text-sm tracking-widest">${item.name}</span>
                    ${descHtml}
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-gold font-bold w-12 text-right">${item.price}€</span>
                    
                    <div class="flex items-center gap-3 bg-black/80 border border-white/10 rounded-full px-2 py-1">
                        <button type="button" onclick="updateQty('${item.id}', -1)" class="w-6 h-6 rounded-full flex items-center justify-center text-gray-400 hover:bg-white/10 hover:text-white transition">
                            <i class="fa-solid fa-minus text-[10px]"></i>
                        </button>
                        <span id="qty-${item.id}" class="text-white font-mono font-bold text-sm w-4 text-center">${initialQty}</span>
                        <button type="button" onclick="updateQty('${item.id}', 1)" class="w-6 h-6 rounded-full flex items-center justify-center text-gold bg-gold/10 hover:bg-gold hover:text-black transition">
                            <i class="fa-solid fa-plus text-[10px]"></i>
                        </button>
                    </div>
                </div>
            </div>
            `;
      });
      container.innerHTML = html;
    }

    /* Funzione per aggiornare la quantità e ricalcolare il totale */
    function updateQty(itemId, change) {
      let currentQty = cart[itemId];
      let newQty = currentQty + change;

      /* Impedisci numeri negativi */
      if (newQty < 0) newQty = 0;

      cart[itemId] = newQty;
      document.getElementById(`qty-${itemId}`).innerText = newQty;

      calculateTotal();
    }

    /* Funzione per calcolare il costo totale incluse le promozioni */
    function calculateTotal() {
      let total = 0;
      let totalItems = 0;

      /* Unire tutte le categorie in un unico array per facilitare il calcolo */
      const allItems = [...inventory.vins, ...inventory.spirits, ...inventory.softs];

      allItems.forEach(item => {
        const qty = cart[item.id];
        totalItems += qty;

        if (qty > 0) {
          /* Se il prodotto ha un'offerta bundle (es. 3 per 10€) */
          if (item.bundleQty && item.bundlePrice) {
            const bundles = Math.floor(qty / item.bundleQty);
            const remainder = qty % item.bundleQty;
            total += (bundles * item.bundlePrice) + (remainder * item.price);
          } else {
            /* Calcolo standard */
            total += qty * item.price;
          }
        }
      });

      /* Aggiorna il testo del totale nella UI */
      document.getElementById('total-price').innerText = total;

      /* Abilita o disabilita il pulsante di validazione in base al carrello */
      const btn = document.getElementById('btn-submit');
      if (totalItems > 0) {
        btn.disabled = false;
        btn.className = "px-6 py-3.5 bg-gradient-to-r from-goldDark via-gold to-goldLight text-black font-black uppercase tracking-widest text-[10px] sm:text-xs rounded-lg hover:shadow-[0_0_20px_rgba(212,175,55,0.6)] transition-all duration-300 cursor-pointer transform hover:-translate-y-1";
      } else {
        btn.disabled = true;
        btn.className = "px-6 py-3.5 bg-gradient-to-r from-gray-700 to-gray-600 text-gray-400 font-black uppercase tracking-widest text-[10px] sm:text-xs rounded-lg transition-all duration-300 opacity-50 cursor-not-allowed";
      }
    }

    /* Funzione per preparare i dati e inviare il form al server Flask */
    function submitCart() {
      /* Filtra il carrello per inviare solo gli elementi con quantità > 0 */
      let finalCart = {};
      for (const [id, qty] of Object.entries(cart)) {
        if (qty > 0) {
          finalCart[id] = qty;
        }
      }

      /* Inserisce l'oggetto JSON nel campo nascosto e invia il modulo */
      document.getElementById('cart_data').value = JSON.stringify(finalCart);
      document.getElementById('barForm').submit();
    }

    /* Inizializza l'interfaccia al caricamento della pagina */
    window.onload = function () {
      renderItems(inventory.vins, 'category-vins');
      renderItems(inventory.spirits, 'category-spirits');
      renderItems(inventory.softs, 'category-softs');

      /* Calcola il totale all'avvio per sbloccare il bottone se l'utente sta modificando un ordine esistente */
      calculateTotal();
    };
  </script>
</body>

</html>
