<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>WECADI - Scan</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/favicon.png') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        /* Configurazione Tailwind per i colori del livello bar */
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#D4AF37',
                        magentaCustom: '#E91E63'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-black text-white font-sans h-screen flex items-center justify-center">

    <div class="text-center p-8 w-full max-w-sm">
        {% if status == 'success' %}
        <div class="w-24 h-24 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-6 animate-bounce">
            <i class="fa-solid fa-check text-5xl text-black"></i>
        </div>
        <h1 class="text-2xl font-bold uppercase tracking-widest text-green-500">Autorisé</h1>
        
        {% elif status == 'warning' %}
        <div class="w-24 h-24 bg-orange-500 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fa-solid fa-exclamation text-5xl text-black"></i>
        </div>
        <h1 class="text-2xl font-bold uppercase tracking-widest text-orange-500">Déjà présent</h1>
        
        {% else %}
        <div class="w-24 h-24 bg-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fa-solid fa-xmark text-5xl text-white"></i>
        </div>
        <h1 class="text-2xl font-bold uppercase tracking-widest text-red-600">Refusé</h1>
        {% endif %}

        <p class="mt-6 text-lg font-medium text-gray-300">{{ message }}</p>

        {% if tier %}
        <div class="mt-6 flex justify-center">
            {% if tier == 'VIP' %}
                <span class="px-5 py-2.5 bg-magentaCustom/20 text-magentaCustom border border-magentaCustom/50 text-xs font-bold uppercase tracking-widest rounded-md shadow-[0_0_15px_rgba(233,30,99,0.4)]">
                    Bar: VIP
                </span>
            {% elif tier == 'Premium' %}
                <span class="px-5 py-2.5 bg-gold/20 text-gold border border-gold/50 text-xs font-bold uppercase tracking-widest rounded-md shadow-[0_0_15px_rgba(212,175,55,0.4)]">
                    Bar: Premium
                </span>
            {% else %}
                <span class="px-5 py-2.5 bg-gray-500/20 text-gray-300 border border-gray-500/50 text-xs font-bold uppercase tracking-widest rounded-md">
                    Bar: Classique
                </span>
            {% endif %}
        </div>
        {% endif %}

        <a href="/admin_dashboard"
            class="mt-10 block w-full py-4 bg-white/10 hover:bg-white/20 rounded-lg text-xs uppercase tracking-widest font-bold transition">
            Retour au Dashboard
        </a>
    </div>
</body>

</html>
