<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>WECADI - Scan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white font-sans h-screen flex items-center justify-center">

    <div class="text-center p-8 w-full max-w-sm">
        {% if status == 'success' %}
            <div class="w-24 h-24 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-6 animate-bounce">
                <i class="fa-solid fa-check text-5xl text-black"></i>
            </div>
            <h1 class="text-2xl font-bold uppercase tracking-widest text-green-500">Autorisé</h1>
        {% elif status == 'warning' %}
            <div class="w-24 h-24 bg-orange-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-exclamation text-5xl text-black"></i>
            </div>
            <h1 class="text-2xl font-bold uppercase tracking-widest text-orange-500">Déjà présent</h1>
        {% else %}
            <div class="w-24 h-24 bg-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-xmark text-5xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold uppercase tracking-widest text-red-600">Refusé</h1>
        {% endif %}

        <p class="mt-6 text-lg font-medium text-gray-300">{{ message }}</p>
        
        <a href="/admin_dashboard" class="mt-10 block w-full py-4 bg-white/10 hover:bg-white/20 rounded-lg text-xs uppercase tracking-widest font-bold transition">
            Retour au Dashboard
        </a>
    </div>
</body>
</html>
